<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="حساب‌یار — مرکز کنترل درآمد، هزینه، کارت‌ها، بودجه، اقساط و تعهدات مالی شخصی به صورت کاملاً آفلاین">
  <title>حساب‌یار | مدیریت مالی شخصی</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="منوی اصلی"></aside>
    <div class="app-main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view-container" tabindex="-1"></main>
    </div>
  </div>

  <nav id="bottomNav" class="bottom-nav" aria-label="ناوبری سریع موبایل"></nav>
  <div id="moreBackdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>
  <aside id="moreDrawer" class="more-drawer hidden" aria-label="منوی بیشتر"></aside>

  <input class="hidden" type="file" id="importFile" accept=".json">
  <input class="hidden" type="file" id="fontUpload" accept=".woff,.woff2,.ttf,.otf">

  <dialog id="dlg" aria-labelledby="dt">
    <div class="dialog-header">
      <h2 id="dt"></h2>
      <button type="button" class="btn btn-icon btn-ghost" data-close-dialog="dlg" aria-label="بستن">✕</button>
    </div>
    <div id="db" class="dialog-body"></div>
  </dialog>

  <dialog id="confirmDlg" aria-labelledby="confirmTitle">
    <div class="dialog-header">
      <h2 id="confirmTitle">تأیید عملیات</h2>
      <button type="button" class="btn btn-icon btn-ghost" data-close-dialog="confirmDlg" aria-label="بستن">✕</button>
    </div>
    <div id="confirmBody" class="dialog-body"></div>
    <div id="confirmActions" class="dialog-actions"></div>
  </dialog>

  <dialog id="appearanceDlg" class="dialog-wide" aria-labelledby="appearanceTitle">
    <div class="dialog-header">
      <h2 id="appearanceTitle">شخصی‌سازی ظاهر</h2>
      <button type="button" class="btn btn-icon btn-ghost" data-close-dialog="appearanceDlg" aria-label="بستن">✕</button>
    </div>
    <div id="appearanceBody" class="dialog-body"></div>
  </dialog>

  <div id="datepickerPopover" class="datepicker-popover hidden" role="dialog" aria-label="تقویم شمسی"></div>
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="notice">برای اجرای حساب‌یار، لطفاً جاوااسکریپت مرورگر خود را فعال کنید.</div>
  </noscript>

  <script src="./vendor/chart.umd.min.js"></script>
  <script src="./vendor/lucide.min.js"></script>
  <script src="./vendor/write-excel-file.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
